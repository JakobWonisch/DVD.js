# DVD.js HTTP server — serve converted disc archives + Solid viewer.
#
# Convert discs on the host (`pnpm convert`), then point DVDJS_WEB_FOLDER at
# the folder that holds `<discId>.tar.gz` (+ cover sidecars).
#
#   cp .env.example .env   # optional tweaks
#   docker compose up -d --build

services:
  dvdjs:
    build: .
    image: dvdjs:local
    container_name: dvdjs
    restart: unless-stopped
    ports:
      - "${DVDJS_HOST_PORT:-3000}:3000"
    environment:
      DVDJS_WEB_FOLDER: /data/web
      DVDJS_PORT: "3000"
      DVDJS_EVICT_DISC_CACHE: "${DVDJS_EVICT_DISC_CACHE:-true}"
      DVDJS_MDNS: "${DVDJS_MDNS:-0}"
      # Optional: mount a JSON file and set DVDJS_CONFIG=/config/app.json
      # DVDJS_CONFIG: /config/app.json
    volumes:
      - "${DVDJS_WEB_VOLUME:-./web}:/data/web"
      # Optional mounted JSON (uncomment + set DVDJS_CONFIG above):
      # - ${DVDJS_CONFIG_FILE:-./config/app.json}:/config/app.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
