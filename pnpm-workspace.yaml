# pnpm 12 workspace + security settings (settings moved here from package.json#pnpm).
# See https://pnpm.io/settings/build

allowBuilds:
  esbuild: true

# Vitest 5.0.2 was published within the default minimumReleaseAge window; pin an
# explicit allowlist so installs stay reproducible without disabling the policy.
minimumReleaseAgeExclude:
  - vitest@5.0.2
  - '@vitest/mocker@5.0.2'
  - '@vitest/spy@5.0.2'
  - '@vitest/expect@5.0.2'
  - '@vitest/runner@5.0.2'
  - '@vitest/snapshot@5.0.2'
  - '@vitest/pretty-format@5.0.2'
  - '@vitest/utils@5.0.2'
  - '@vitest/browser@5.0.2'
  - '@vitest/coverage-v8@5.0.2'
  - '@vitest/coverage-istanbul@5.0.2'
  - '@vitest/ui@5.0.2'
